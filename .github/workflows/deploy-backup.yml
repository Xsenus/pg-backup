name: Deploy pg-backup to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert secrets
        run: |
          [ -n "${{ secrets.VPS_HOST }}" ] || { echo "❌ VPS_HOST empty"; exit 1; }
          [ -n "${{ secrets.VPS_USER }}" ] || { echo "❌ VPS_USER empty"; exit 1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "❌ VPS_SSH_KEY empty"; exit 1; }
          [ -n "${{ secrets.PG_BACKUP_ENV }}" ] || { echo "❌ PG_BACKUP_ENV empty"; exit 1; }
          # VPS_SSH_PASSPHRASE опционален (если ключ с passphrase — задайте секрет)

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "scripts/*,systemd/*,.gitignore,.env.example,README.md"
          target: "/opt/pg-backup"
          overwrite: true
          strip_components: 0

      - name: Write env on VPS and install systemd
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu

            sudo mkdir -p /opt/pg-backup
            sudo chown -R "$USER:$USER" /opt/pg-backup

            # Записываем многострочный PG_BACKUP_ENV (сохраняем переносы строк)
            sudo tee /etc/pg-multi-backup.env > /dev/null <<'__ENV__'
            ${{ secrets.PG_BACKUP_ENV }}
            __ENV__
            # Нормализуем переводы строк (на случай CRLF)
            sudo sed -i 's/\r$//' /etc/pg-multi-backup.env
            sudo chmod 600 /etc/pg-multi-backup.env

            # Всё, что читает /etc/pg-multi-backup.env (600, root), делаем в root-подсессии
            RUN_USER="$USER"
            sudo bash -s -- "$RUN_USER" <<'ROOTSH'
            set -eu
            RUN_USER="$1"

            # Подтягиваем переменные окружения из файла
            set -a
            . /etc/pg-multi-backup.env
            set +a

            : "${BACKUP_ROOT:?BACKUP_ROOT is not set}"
            : "${LOG_DIR:?LOG_DIR is not set}"

            mkdir -p "$BACKUP_ROOT" "$LOG_DIR"
            chown -R "$RUN_USER:$RUN_USER" "$BACKUP_ROOT" "$LOG_DIR"

            # Установить postgresql-client при необходимости
            if ! command -v pg_dump >/dev/null 2>&1; then
              apt-get update
              apt-get install -y postgresql-client
            fi

            # Права на скрипты и установка systemd юнитов
            chmod +x /opt/pg-backup/scripts/*.sh
            /opt/pg-backup/scripts/install_systemd.sh

            # Тестовый запуск (не обязательно)
            systemctl start pg-multi-backup.service || true

            echo "[INFO] Service status:"
            systemctl --no-pager --full status pg-multi-backup.service || true

            echo "[INFO] Timer status:"
            systemctl --no-pager --full status pg-multi-backup.timer || true

            echo "[INFO] Last logs:"
            journalctl -u pg-multi-backup.service -n 50 --no-pager || true
            ROOTSH
