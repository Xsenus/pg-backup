name: Deploy pg-backup to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert secrets
        run: |
          [ -n "${{ secrets.VPS_HOST }}" ] || { echo "❌ VPS_HOST empty"; exit 1; }
          [ -n "${{ secrets.VPS_USER }}" ] || { echo "❌ VPS_USER empty"; exit 1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "❌ VPS_SSH_KEY empty"; exit 1; }
          [ -n "${{ secrets.PG_BACKUP_ENV }}" ] || { echo "❌ PG_BACKUP_ENV empty"; exit 1; }
          # VPS_SSH_PASSPHRASE опционален — укажите, если ключ с passphrase

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "scripts/*,systemd/*,.gitignore,.env.example,README.md"
          target: "/opt/pg-backup"
          overwrite: true
          strip_components: 0

      - name: Write env on VPS and install systemd
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu

            sudo mkdir -p /opt/pg-backup
            sudo chown -R "$USER:$USER" /opt/pg-backup

            # Надёжно пишем многострочный PG_BACKUP_ENV (переносы сохраняются)
            sudo tee /etc/pg-multi-backup.env > /dev/null <<'__ENV__'
            ${{ secrets.PG_BACKUP_ENV }}
            __ENV__
            sudo chmod 600 /etc/pg-multi-backup.env

            # Нормализуем переводы строк (на случай CRLF)
            sudo sed -i 's/\r$//' /etc/pg-multi-backup.env

            # Экспортируем переменные из файла окружения
            set -a
            . /etc/pg-multi-backup.env
            set +a

            # Проверяем, что обязательные заданы
            : "${BACKUP_ROOT:?❌ BACKUP_ROOT is not set in /etc/pg-multi-backup.env}"
            : "${LOG_DIR:?❌ LOG_DIR is not set in /etc/pg-multi-backup.env}"

            # Готовим каталоги
            sudo mkdir -p "$BACKUP_ROOT" "$LOG_DIR"
            sudo chown -R "$USER:$USER" "$BACKUP_ROOT" "$LOG_DIR"

            # Установить postgresql-client при необходимости
            if ! command -v pg_dump >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            fi

            # Права на скрипты
            sudo chmod +x /opt/pg-backup/scripts/*.sh

            # Установка systemd юнитов
            sudo /opt/pg-backup/scripts/install_systemd.sh

            # Тестовый запуск (не обязательно)
            sudo systemctl start pg-multi-backup.service || true

            echo "[INFO] Service status:"
            systemctl --no-pager --full status pg-multi-backup.service || true

            echo "[INFO] Timer status:"
            systemctl --no-pager --full status pg-multi-backup.timer || true

            echo "[INFO] Last logs:"
            sudo journalctl -u pg-multi-backup.service -n 50 --no-pager || true
