name: Deploy pg-backup to VPS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert secrets
        run: |
          [ -n "${{ secrets.VPS_HOST }}" ] || { echo "❌ VPS_HOST empty"; exit 1; }
          [ -n "${{ secrets.VPS_USER }}" ] || { echo "❌ VPS_USER empty"; exit 1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "❌ VPS_SSH_KEY empty"; exit 1; }
          # PG_BACKUP_ENV проверим позже на самом VPS, только если файла нет
          # VPS_SSH_PASSPHRASE опционален (если ключ без passphrase — можно не задавать)

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "scripts/*,systemd/*,.gitignore,.env.example,README.md"
          target: "/opt/pg-backup"
          overwrite: true
          strip_components: 0

      - name: Write env on VPS (if missing), install systemd and run
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -eu

            sudo mkdir -p /opt/pg-backup
            sudo chown -R "$USER:$USER" /opt/pg-backup

            # Создаём /etc/pg-multi-backup.env ТОЛЬКО если его ещё нет
            if [ ! -f /etc/pg-multi-backup.env ]; then
              if [ -z "${{ secrets.PG_BACKUP_ENV }}" ]; then
                echo "❌ /etc/pg-multi-backup.env отсутствует и секрет PG_BACKUP_ENV не задан."
                exit 1
              fi
              sudo tee /etc/pg-multi-backup.env > /dev/null <<'__ENV__'
              ${{ secrets.PG_BACKUP_ENV }}
              __ENV__
              sudo sed -i 's/\r$//' /etc/pg-multi-backup.env
              sudo chmod 600 /etc/pg-multi-backup.env
              echo "[INFO] Created /etc/pg-multi-backup.env from secret."
            else
              echo "[INFO] /etc/pg-multi-backup.env exists; leaving as-is."
            fi

            # Показать только имена ключей из ENV (без значений), для быстрой диагностики
            echo "[INFO] ENV keys present:"
            sudo awk -F= '/^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*[[:space:]]*=/ { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print "  - " $1"=<hidden>" }' /etc/pg-multi-backup.env | head -n 50 || true

            # Установить postgresql-client при необходимости
            if ! command -v pg_dump >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            fi

            # Права на скрипты
            sudo chmod +x /opt/pg-backup/scripts/*.sh

            # Установка systemd юнитов (service + timer)
            sudo /opt/pg-backup/scripts/install_systemd.sh

            # Тестовый запуск — сервис сам прочитает EnvironmentFile
            sudo systemctl start pg-multi-backup.service || true

            echo "[INFO] Service status:"
            sudo systemctl --no-pager --full status pg-multi-backup.service || true

            echo "[INFO] Timer status:"
            sudo systemctl --no-pager --full status pg-multi-backup.timer || true

            echo "[INFO] Last logs:"
            sudo journalctl -u pg-multi-backup.service -n 100 --no-pager || true
